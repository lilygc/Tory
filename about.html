<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Me — Feel Good Eats</title>
<style>
  :root {
    --teal: #4F9B96;
    --dark-green: #1F5C4A;
    --charcoal: #2B2B2B;
    --cream: #FAF8F5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: var(--cream);
    color: var(--charcoal);
    line-height: 1.6;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 24px 56px;
    text-align: center;
  }

  .site-title {
    font-size: 22px;
    color: var(--teal);
    font-weight: normal;
    letter-spacing: 0.3px;
    margin: 0 0 32px;
  }

  .site-title a {
    color: var(--teal);
    text-decoration: none;
  }

  h1 {
    font-size: 32px;
    margin: 80px 0 16px;
    color: var(--dark-green);
    font-weight: normal;
    letter-spacing: 0.3px;
  }

  p.coming-soon {
    font-family: Arial, sans-serif;
    font-size: 15px;
    color: #8A8578;
    margin: 0 0 80px;
  }

  .back-link {
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;
  }

  .back-link a {
    color: var(--dark-green);
    text-decoration: none;
  }

  .back-link a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="wrap">

    <p class="site-title"><a href="index.html">Feel Good Eats</a></p>

    <h1>About Me</h1>
    <p class="coming-soon">Content coming soon.</p>

    <p class="back-link"><a href="index.html">&larr; Back to Home</a></p>

  </div>
</body>
</html>
