<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tory Chiappelli, Personal Chef</title>
<style>
  :root {
    --teal: #4F9B96;
    --dark-green: #1F5C4A;
    --charcoal: #2B2B2B;
    --cream: #FAF8F5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: var(--cream);
    color: var(--charcoal);
    line-height: 1.6;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 24px 80px;
    text-align: center;
  }

  .photo {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    margin: 0 auto 28px;
    background: #E4E0D8;
    border: 4px solid var(--teal);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo span {
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #8A8578;
  }

  h1 {
    font-size: 40px;
    margin: 0 0 8px;
    color: var(--dark-green);
    font-weight: normal;
    letter-spacing: 0.3px;
  }

  .tagline {
    font-family: Arial, sans-serif;
    font-size: 16px;
    color: var(--teal);
    font-weight: bold;
    margin: 0 0 32px;
  }

  p.intro {
    font-size: 18px;
    color: #4A4A4A;
    max-width: 480px;
    margin: 0 auto 40px;
  }

  .contact {
    font-family: Arial, sans-serif;
    font-size: 15px;
    color: #555;
    border-top: 1px solid #DDD8CC;
    padding-top: 24px;
    margin-top: 16px;
  }

  .contact a {
    color: var(--dark-green);
    text-decoration: none;
  }

  .contact a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="wrap">

    <div class="photo">
      <img src="tory.jpg" alt="Tory Chiappelli">
    </div>

    <h1>Feel Good Eats</h1>
    <p class="tagline">Tory Chiappelli, Personal Chef</p>

    <p class="intro">
      Classically trained, celebrity-tour-tested cooking, brought to your
      kitchen or picked up ready to eat. San Antonio's answer to
      restaurant-quality meals without the restaurant.
    </p>

    <div class="contact">
      Tel.: (210) 848-5107<br>
      <a href="mailto:EatingFeelGoodEats@gmail.com">EatingFeelGoodEats@gmail.com</a>
    </div>

  </div>
</body>
</html>
